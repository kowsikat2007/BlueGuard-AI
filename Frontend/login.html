<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Mangrove — Secure Sign In</title>
  <link rel="stylesheet" href="style.css">

  <script>
    // If user already has an active session, open the dashboard directly
    if (localStorage.getItem("mangrove_session") === "true") {
      window.location.replace("index.html");
    }
  </script>
</head>

<body class="login-body">

  <div class="login-wrapper">

    <!-- Brand Header -->
    <div class="login-brand-section">
      <div class="login-logo-circle">
        <span class="login-logo-icon">🌱</span>
      </div>
      <h1 class="login-brand-heading">SMART MANGROVE</h1>
      <p class="login-brand-subheading">Intelligent Blue Carbon &amp; IoT Monitoring System</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <div class="login-card-header">
        <h2>Sign In</h2>
        <p>Enter your authorized credentials to access the monitoring console</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate autocomplete="off">

        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-container">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Username"
              autocomplete="off"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-container">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="togglePassword"
              class="password-toggle-btn"
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >
              👁️
            </button>
          </div>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="loginError" class="login-error-card" style="display: none;" role="alert">
          <span class="error-icon">⚠️</span>
          <span id="errorMessage">Invalid username or password</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="login-submit-btn">
          <span>Sign In</span>
          <span class="btn-arrow">→</span>
        </button>

      </form>

    </div>

    <!-- Secure Footer -->
    <footer class="login-footer">
      <p>Smart Mangrove Monitoring &amp; Blue Carbon Registry</p>
      <small>Protected System • Authorized Access Only</small>
    </footer>

  </div>

  <!-- Login Logic -->
  <script>
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("loginError");
    const togglePasswordBtn = document.getElementById("togglePassword");

    // Hide error when user modifies inputs
    usernameInput.addEventListener("input", function () {
      errorBox.style.display = "none";
    });

    passwordInput.addEventListener("input", function () {
      errorBox.style.display = "none";
    });

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener("click", function () {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePasswordBtn.textContent = isPassword ? "🙈" : "👁️";
      togglePasswordBtn.title = isPassword ? "Hide password" : "Show password";
    });

    // Form Submission & Credentials Verification
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // Case-sensitive credential verification: Blue Guard / BG6511
      if (username === "Blue Guard" && password === "BG6511") {
        errorBox.style.display = "none";
        localStorage.setItem("mangrove_session", "true");
        localStorage.setItem("mangrove_user", "Blue Guard");
        window.location.replace("index.html");
      } else {
        errorBox.style.display = "flex";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });
  </script>

</body>

</html>
